<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} — My Written Life</title>

  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>

<body>

  <header class="site-header">
    <a class="logo" href="{{ '/' | relative_url }}">My Written Life</a>

    <nav class="nav">
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/' | relative_url }}#writing">Writing</a>
      <a href="{{ '/' | relative_url }}#about">About</a>
    </nav>
  </header>

  <main>

    <article class="story-page">

      <p class="eyebrow">Writing</p>

      <h1>{{ page.title }}</h1>

      <p class="story-date">{{ page.date | date: "%B %-d, %Y" }}</p>

      <div class="story-content">
        {{ content }}
      </div>

    </article>

  </main>

  <footer>
    <p>Written slowly. Lived imperfectly.</p>
    <p>© 2026 My Written Life</p>
  </footer>

</body>
</html>
